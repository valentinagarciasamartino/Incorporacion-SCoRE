[archivos]
# Nombres de los archivos de calibracion funcional
# (relativos a la carpeta del paciente)
funcional_R = FCM_right
funcional_L = FCM_left
standing_copia = Standing~score
mdx_score_suffix = ~score
standing_calculo = FCM_std

[filtro]
# Parametros del filtro Butterworth pasa-bajos
butter_order  = 4
butter_cutoff = 6
butter_fs     = 100

[interpolacion]
# Maximo de frames consecutivos a interpolar
max_gap = 20

[standing_R]
# Nombres de los marcadores del cluster del muslo derecho en el standing
thigh  = rthi
clup   = r_CLUp
cldown = r_Down
knee   = r knee 1
# Pelvis (igual para ambos lados)
sacrum = sacrum
r_asis = r asis
l_asis = l asis

[standing_L]
# Nombres de los marcadores del cluster del muslo izquierdo en el standing
thigh  = lthi
clup   = l_CLUp
cldown = l_CLDown
knee   = l knee 1
# Pelvis (igual para ambos lados)
sacrum = sacrum
r_asis = r asis
l_asis = l asis

[funcional]
# Nombres de los marcadores en los archivos de calibracion funcional
# (sin lado — los mismos para R y L)
thigh  = Thigh
clup   = CLUp
cldown = CLDown
knee   = knee
sacrum = sacrum
r_asis = r asis
l_asis = l asis
