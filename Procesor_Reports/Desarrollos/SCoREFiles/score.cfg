# ============================================================
# score.cfg
# Archivo de configuracion para el calculo del HJC con SCoRE
# Modificar aqui si cambian los nombres de marcadores o parametros
# ============================================================

[archivos]
# Nombres de los archivos de calibracion funcional
# (relativos a la carpeta del paciente)
funcional_R = Walking 02
funcional_L = Walking 01
standing_copia = Standing_SCORE
mdx_score_suffix = _SCORE
reference_frame = 2

[filtro]
# Parametros del filtro Butterworth pasa-bajos
butter_order  = 4
butter_cutoff = 6
butter_fs     = 100

[interpolacion]
# Maximo de frames consecutivos a interpolar
max_gap = 20

[funcional]
# Nombres de los marcadores en los archivos de calibracion funcional
# (sin lado — los mismos para R y L)
thigh  = Thigh
clup   = CLUp
cldown = CLDown
#knee   = knee
sacrum = sacrum
r_asis = r asis
l_asis = l asis
